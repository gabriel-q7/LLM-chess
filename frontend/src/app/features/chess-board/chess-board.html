<div class="relative w-full select-none">
  <div
    class="grid aspect-square w-full grid-cols-8 overflow-hidden rounded-lg shadow-xl ring-1 ring-black/20"
    role="grid"
    aria-label="Chess board"
  >
    @for (square of squares(); track square.name) {
      <button
        type="button"
        class="relative flex aspect-square items-center justify-center text-[min(9vw,3.25rem)] leading-none transition-colors focus-visible:z-10 focus-visible:outline-3 focus-visible:outline-sky-500"
        [class]="squareClass(square)"
        [attr.data-square]="square.name"
        [attr.aria-label]="label(square)"
        (click)="onSquareClick(square.name)"
      >
        @if (square.piece; as piece) {
          <span
            class="piece relative z-1"
            [class.text-white]="piece.color === 'WHITE'"
            [class.piece-white]="piece.color === 'WHITE'"
            [class.text-neutral-900]="piece.color === 'BLACK'"
            [attr.data-piece]="piece.color + '-' + piece.type"
            >{{ glyph(piece) }}</span
          >
        }
        @if (targets().has(square.name)) {
          <span
            class="pointer-events-none absolute z-2 rounded-full"
            [class]="square.piece ? 'inset-1 ring-4 ring-black/30' : 'size-1/3 bg-black/25'"
            data-target
          ></span>
        }
        @if (square.rankLabel) {
          <span
            class="absolute top-0.5 left-1 text-[0.6rem] font-semibold sm:text-xs"
            [class.text-amber-800]="square.light"
            [class.text-amber-100]="!square.light"
            >{{ square.rankLabel }}</span
          >
        }
        @if (square.fileLabel) {
          <span
            class="absolute right-1 bottom-0.5 text-[0.6rem] font-semibold sm:text-xs"
            [class.text-amber-800]="square.light"
            [class.text-amber-100]="!square.light"
            >{{ square.fileLabel }}</span
          >
        }
      </button>
    }
  </div>

  @if (pendingPromotion()) {
    <div class="absolute inset-0 z-20 flex items-center justify-center rounded-lg bg-black/50" role="dialog" aria-label="Choose promotion piece">
      <div class="flex flex-col items-center gap-3 rounded-xl bg-white p-4 shadow-2xl dark:bg-neutral-800">
        <p class="text-sm font-medium text-neutral-700 dark:text-neutral-200">Promote to</p>
        <div class="flex gap-2">
          @for (piece of promotionPieces; track piece) {
            <button
              type="button"
              class="flex size-14 items-center justify-center rounded-lg bg-amber-100 text-4xl hover:bg-amber-200"
              [class.text-white]="orientation() === 'WHITE'"
              [class.piece-white]="orientation() === 'WHITE'"
              [class.text-neutral-900]="orientation() === 'BLACK'"
              [attr.data-promotion]="piece"
              (click)="choosePromotion(piece)"
            >
              {{ promotionGlyph(piece) }}
            </button>
          }
        </div>
        <button type="button" class="text-sm text-neutral-500 hover:underline" (click)="cancelPromotion()">Cancel</button>
      </div>
    </div>
  }
</div>
